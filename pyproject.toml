[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glossary-mt"
version = "0.1.0"
description = "用語集を守る日韓の技術文書翻訳パイプライン（Markdown / Excel / PowerPoint, Claude API）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["anthropic>=2.3", "openpyxl>=3.1"]

[project.optional-dependencies]
pptx = ["python-pptx>=1.0"]
dev = ["pytest>=7", "ruff>=0.4", "hypothesis>=6", "python-pptx>=1.0"]

[project.scripts]
glossary-mt = "glossary_mt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# 行長はフォーマッタに任せる (日本語・韓国語の文字列は折り返さない)
ignore = ["E501"]
